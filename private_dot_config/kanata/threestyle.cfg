(defcfg
  process-unmapped-keys yes
)

(defsrc
  esc  f1   f2   f3   f4   f5   f6   f7   f8   f9   f10  f11  f12
  grv  1    2    3    4    5    6    7    8    9    0    -    =    bspc
  tab  q    w    e    r    t    y    u    i    o    p    [    ]    \
  caps a    s    d    f    g    h    j    k    l    ;    '         ret
  lsft z    x    c    v    b    n    m    ,    .    /    rsft      up
  fn   lctl lalt lmet      spc            rmet ralt           left down rght
)

(deflayer maya
  esc  f1   f2   f3   f4   f5   f6   f7   f8   f9   f10  f11  f12
  @grl 1    2    3    4    5    6    7    8    9    0    -    =    bspc
  tab  @ab  l    @ad  g    q    [    j    f    @ao  u    ,    ;    \
  @chy @an  @ar  t    @as  v    ]    k    @ah  a    @ae  i         ret
  @sfz @ax  m    @ac  @aw  -    /    p    y    '    .    rsft      up
  @fn  lctl lalt lmet      spc            lsft @nav           left down rght
)

(deflayer colemakdh
  esc  f1   f2   f3   f4   f5   f6   f7   f8   f9   f10  f11  f12
  @grl 1    2    3    4    5    6    7    8    9    0    -    =    bspc
  tab  q    w    f    p    b    j    l    u    y    ;    [    ]    \
  @chy a    r    s    t    g    m    n    e    i    o    '         ret
  lsft x    c    d    v    z    k    h    ,    .    /    rsft      up
  @fn  lctl lalt lmet      spc            @nav ralt           left down rght
)

(deflayer qwerty
  esc  f1   f2   f3   f4   f5   f6   f7   f8   f9   f10  f11  f12
  @grl 1    2    3    4    5    6    7    8    9    0    -    =    bspc
  tab  q    w    e    r    t    y    u    i    o    p    [    ]    \
  @chy a    s    d    f    g    h    j    k    l    ;    '         ret
  lsft z    x    c    v    b    n    m    ,    .    /    rsft      up
  @fn  lctl lalt lmet      spc            @nav ralt           left down rght
)

(deflayer nav
  _    _    _    _    _    _    _    _    _    _    _    _    _
  _    _    _    _    _    _    _    _    _    _    _    _    _    _
  _    _    _    _    _    _    _    _    home pgdn pgup end  _    _
  _    _    _    _    _    _    _    _    left down up   rght _
  _    _    _    _    _    _    _    _    _    _    _    _         _
  _    _    _    _         _              _    _              _    _    _
)

(deflayer sym
  _    _    _    _    _    _    _    _    _    _    _    _    _
  _    _    _    _    _    _    _    _    _    _    _    _    _    _
  _    _    _    _    _    _    _    home pgdn pgup end  _    _    _
  _    _    _    _    _    _    _    left down up   rght _    _
  _    _    _    _    _    _    _    _    _    _    _    _         _
  _    _    _    _         _              _    _              _    _    _
)

(defalias
  ;; tap: backtick (grave), hold: toggle layer-switching layer while held
  grl (tap-hold 200 200 grv (layer-toggle layers))
  may (layer-switch maya)
  qwr (layer-switch qwerty)
  cdh (layer-switch colemakdh)
  chy (multi lsft lctl lalt)
  fn (multi (layer-toggle function) fn)
  nav (layer-while-held nav)

  ;; macOS function key glyphs
  mct C-up ;; Mission Control
  sls M-spc ;; Spotlight Search
  dtn S-C-A-M-f5 ;; Dictation
  dnd S-C-A-M-f6 ;; Do Not Disturb

  sfz (tap-hold 200 200 z lsft)
  ;; adaptive swaps
  ae (switch
       ((key-history u 1)) o break
       () e break
     )
  ao (switch
       ((key-history u 1)) e break
       () o break
     )
  ac (switch
       ((key-history s 1)) d break
       ((key-history m 1)) b break
       () c break
     )
  ad (switch
       ((key-history s 1)) c break
       ((key-history b 1)) r break
       () d break
     )
  ar (switch
       ((key-history b 1)) d break
       ((key-history s 1)) w break
       () r break
     )
  ab (switch
       ((key-history m 1)) c break
       () b break
     )
  ah (switch
       ((key-history p 1)) n break
       () h break
     )
  an (switch
       ((key-history p 1)) h break
       () n break
     )
  aw (switch
       ((key-history s 1)) r break
       () w break
     )
  as (switch
       ((key-history c 1)) x break
       () s break
     )
  ax (switch
       ((key-history c 1)) s break
       () x break
     )
)

(deflayer layers
  _    _    _    _    _    _    _    _    _    _    _    _    _
  _    @cdh @qwr @may _    _    _    _    _    _    _    _    _    _
  _    _    _    _    _    _    _    _    _    _    _    _    _    _
  _    _    _    _    _    _    _    _    _    _    _    _    _
  _    _    _    _    _    _    _    _    _    _    _    _         _
  _    _    _    _         lrld           _    _              _    _    _
)

(deflayer function
  _    brdn brup @mct @sls @dtn @dnd prev pp   next mute vold volu
  _    _    _    _    _    _    _    _    _    _    _    _    _    del
  _    _    _    _    _    _    _    _    _    _    _    _    _    _
  _    _    _    _    _    _    _    _    _    _    _    _    _
  _    _    _    _    _    _    _    _    _    _    _    _         pgup
  _    _    _    _         _              _    _              home pgdn end
)
